<!DOCTYPE html>
<html lang="vi">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Watch Video | avboy.top</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css?v=210">
</head>
<body>
<!-- ===== 18+ AGE GATE PRO ===== -->
  <!-- ===== 18+ AGE GATE ===== -->
<div class="header-row">

    <a href="/" class="logo-link">
      <div class="logo">AVBOY</div>
    </a>

    <nav class="menu">
  <a class="menu-item active"></a>
  <a class="menu-item" href="/?hot=1">Hots</a>
  <a class="menu-item">Photos</a>
  <a class="menu-item" href="/">Videos</a>
</nav>

  </div>

  <!-- SEARCH + TAG -->
  <div class="search-row">

    <input
      type="text"
      id="search"
      class="search"
      placeholder="Search for videos..."
    >

    <button class="tag-btn">
      ☰ Tags
    </button>

  </div>

</div>
  <!-- ===== LOADING ===== -->
  <div id="watch-loading" class="watch-loading">
    <div class="video-skeleton"></div>
    <div class="text-skeleton"></div>
    <div class="list-skeleton"></div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="watch-container" class="container hidden">

    <!-- HOME BUTTON -->
<div class="watch-home">
  <a href="/" class="home-btn">
    ← Home
  </a>
</div>
    <!-- ===== VIDEO PANEL ===== -->
    <section class="watch-panel">

      <!-- PLAYER -->
      <div class="player-wrapper" id="player"></div>

      <!-- INFO -->
      <div class="watch-info">
        <h1 class="watch-title" id="video-title"></h1>

        <div class="watch-meta">
  <div id="video-tags" class="tag-box"></div>

  <div class="meta-row">
  <span id="video-view">0 views</span>
  <span id="video-duration"></span>
  <span id="video-date"></span>

  <a
  id="download-btn"
  class="download-btn"
  href="#"
  target="_blank"
  rel="nofollow noopener"
>
  ↓ Download
</a>
</div>
<button
  id="openFullscreenBtn"
  class="open-fullscreen-btn"
  style="display:none"
>
  ⤢ fullscreen video
</button>
    </section>

    <!-- ===== RELATED ===== -->
    <section class="related-panel">
      <h2 class="section-title">Recommended Videos</h2>
      <div id="related-grid" class="grid"></div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    © 2026 avboy.top - All rights reserved.
  </footer>

<script src="js/watch.js?v=290"></script>

  <div id="tag-popup" class="tag-popup">
  <div class="tag-popup-box">

    <div class="tag-popup-header">
      <span>All Tags</span>
      <span id="tag-close">✕</span>
    </div>

    <div id="tag-list" class="tag-list"></div>

  </div>
</div>
</body>
</html>
