<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Watch Video | avboy.top</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css?v=30">
</head>
<body>
<!-- ===== 18+ AGE GATE PRO ===== -->
<div id="ageGate" class="age-gate">
  <div class="age-card">
    <div class="age-badge">18+</div>

    <h2 class="age-title">WARNING</h2>

    <p class="age-desc">
      This website contains adult content.<br>
      You must be at least 18 years old to enter.
    </p>

    <div class="age-actions">
      <button id="ageEnter" class="age-btn enter-btn">
        Enter
      </button>

      <a href="https://google.com" class="age-btn exit-btn">
        Exit
      </a>
    </div>
  </div>
</div>
  <!-- ===== PAGE COVER (ANTI FLASH) ===== -->
  <div id="page-cover" class="page-cover"></div>

  <!-- ===== HEADER GLASS ===== -->
  <div class="top-panel glass">
    <a href="/" class="logo-link">
      <div class="logo">AVBOY.TOP</div>
    </a>
  </div>

  <!-- ===== LOADING ===== -->
  <div id="watch-loading" class="watch-loading">
    <div class="video-skeleton"></div>
    <div class="text-skeleton"></div>
    <div class="list-skeleton"></div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="watch-container" class="container hidden">

    <!-- ===== VIDEO PANEL ===== -->
    <section class="watch-panel">

      <!-- PLAYER -->
      <div class="player-wrapper" id="player"></div>

      <!-- INFO -->
      <div class="watch-info">
        <h1 class="watch-title" id="video-title"></h1>

        <div class="watch-meta">
          <span id="video-view">0 views</span>
          <span id="video-duration"></span>
        </div>

        <a
          id="download-btn"
          class="download-btn"
          href="#"
          target="_blank"
          rel="nofollow noopener"
        >
           Download
        </a>
      </div>
<button
  id="openFullscreenBtn"
  class="open-fullscreen-btn"
  style="display:none"
>
  ⤢ fullscreen video
</button>
    </section>

    <!-- ===== RELATED ===== -->
    <section class="related-panel">
      <h2 class="section-title">Recommended Videos</h2>
      <div id="related-grid" class="grid"></div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    © 2026 avboy.top - All rights reserved.
  </footer>

  <script src="js/watch.js?v=120"></script>

</body>
</html>
