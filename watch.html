<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Watch Video | avboy.top</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css?v=30">
</head>
<body>

  <!-- ===== PAGE COVER (ANTI FLASH) ===== -->
  <div id="page-cover" class="page-cover"></div>

  <!-- ===== HEADER GLASS ===== -->
  <div class="top-panel glass">
    <a href="/" class="logo-link">
      <div class="logo">AVBOY</div>
    </a>
  </div>

  <!-- ===== LOADING ===== -->
  <div id="watch-loading" class="watch-loading">
    <div class="video-skeleton"></div>
    <div class="text-skeleton"></div>
    <div class="list-skeleton"></div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="watch-container" class="container hidden">

    <!-- ===== VIDEO PANEL ===== -->
    <section class="watch-panel">

      <!-- PLAYER -->
      <div class="player-wrapper" id="player"></div>

      <!-- INFO -->
      <div class="watch-info">
        <h1 class="watch-title" id="video-title"></h1>

        <div class="watch-meta">
          <span id="video-view">0 views</span>
          <span id="video-duration"></span>
        </div>

        <a
          id="download-btn"
          class="download-btn"
          href="#"
          target="_blank"
          rel="nofollow noopener"
        >
           Download
        </a>
      </div>
<button
  id="openFullscreenBtn"
  class="open-fullscreen-btn"
  style="display:none"
>
  ⤢ fullscreen video
</button>
    </section>

    <!-- ===== RELATED ===== -->
    <section class="related-panel">
      <h2 class="section-title">Recommended Videos</h2>
      <div id="related-grid" class="grid"></div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    © 2026 avboy.top - All rights reserved.
  </footer>

  <script src="js/watch.js?v=65"></script>
  <div id="chat-fab">💬</div>

<!-- OVERLAY -->
<div id="chat-overlay"></div>

<!-- CHAT MODAL -->
<div id="chat-modal">
  <div class="chat-header">
    <span>💬 Live Chat</span>
    <span id="chat-close">✕</span>
  </div>

  <div id="chat-messages"></div>

  <div class="chat-input">
    <input id="chat-text" placeholder="chat..." />
    <button id="send-btn">➤</button>
  </div>
</div>

  <script>
    const ws = new WebSocket("wss://box.avboy.top");

    const name = "User" + Math.floor(Math.random() * 9999);
    const box = document.getElementById("chat-messages");

    ws.onmessage = (e) => {
      const div = document.createElement("div");
      div.textContent = e.data;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    };

    function send() {
      const input = document.getElementById("chat-text");
      if (!input.value.trim()) return;
      ws.send(name + ": " + input.value);
      input.value = "";
    }

    document.getElementById("send-btn").onclick = send;
    document.getElementById("chat-text").onkeydown = e => {
      if (e.key === "Enter") send();
    };
  </script>
  <script>
const fab = document.getElementById("chat-fab");
const modal = document.getElementById("chat-modal");
const overlay = document.getElementById("chat-overlay");
const closeBtn = document.getElementById("chat-close");

function openChat(){
  modal.classList.add("active");
  overlay.classList.add("active");
}

function closeChat(){
  modal.classList.remove("active");
  overlay.classList.remove("active");
}

fab.onclick = openChat;
overlay.onclick = closeChat;
closeBtn.onclick = closeChat;
</script>
</body>
</html>
