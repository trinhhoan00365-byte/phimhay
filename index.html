<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>avboy.top</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css?v=35">
</head>
<body>

  <!-- ===== HEADER GLASS ===== -->
  <div class="top-panel glass">
    <div class="header-row">
      <a href="/" class="logo-link">
        <div class="logo">AVBOY</div>
      </a>
    </div>

    <div class="search-filter-box">
      <input
        type="text"
        id="search"
        class="search"
        placeholder="Search Videos..."
      >

      <div class="filter-row">
        <select id="filterView" class="filter-select">
          <option value="view_desc"> High View</option>
          <option value="view_asc"> Low view</option>
        </select>

        <select id="filterTime" class="filter-select">
          <option value="all">All Time</option>
          <option value="7">7 day</option>
          <option value="30">30 day</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <main class="container">
    <div id="video-grid" class="grid"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    © 2026 avboy.top - All rights reserved.
  </footer>

  <script src="js/main.js?v=3"></script>
    <!-- CHAT BUTTON -->
<div id="chat-fab">💬</div>

<!-- OVERLAY -->
<div id="chat-overlay"></div>

<!-- CHAT MODAL -->
<div id="chat-modal">
  <div class="chat-header">
    <span>💬 Live Chat</span>
    <span id="chat-close">✕</span>
  </div>

  <div id="chat-messages"></div>

  <div class="chat-input">
    <input id="chat-text" placeholder="chat..." />
    <button id="send-btn">➤</button>
  </div>
</div>

  <script>
    const ws = new WebSocket("wss://box.avboy.top");

    const name = "User" + Math.floor(Math.random() * 9999);
    const box = document.getElementById("chat-messages");

    ws.onmessage = (e) => {
      const div = document.createElement("div");
      div.textContent = e.data;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    };

    function send() {
      const input = document.getElementById("chat-text");
      if (!input.value.trim()) return;
      ws.send(name + ": " + input.value);
      input.value = "";
    }

    document.getElementById("send-btn").onclick = send;
    document.getElementById("chat-text").onkeydown = e => {
      if (e.key === "Enter") send();
    };
  </script>
  <script>
const fab = document.getElementById("chat-fab");
const modal = document.getElementById("chat-modal");
const overlay = document.getElementById("chat-overlay");
const closeBtn = document.getElementById("chat-close");

function openChat(){
  modal.classList.add("active");
  overlay.classList.add("active");
}

function closeChat(){
  modal.classList.remove("active");
  overlay.classList.remove("active");
}

fab.onclick = openChat;
overlay.onclick = closeChat;
closeBtn.onclick = closeChat;
</script>
</body>
</html>
