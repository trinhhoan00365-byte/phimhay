<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>avboy.top</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css?v=38">
</head>
<body>
<!-- ===== 18+ AGE GATE PRO ===== -->
<div id="ageGate" class="age-gate">
  <div class="age-card">
    <div class="age-badge">18+</div>

    <h2 class="age-title">WARNING</h2>

    <p class="age-desc">
      This website contains adult content.<br>
      You must be at least 18 years old to enter.
    </p>

    <div class="age-actions">
      <button id="ageEnter" class="age-btn enter-btn">
        Enter
      </button>

      <a href="https://google.com" class="age-btn exit-btn">
        Exit
      </a>
    </div>
  </div>
</div>
  <!-- ===== HEADER GLASS ===== -->
  <div class="top-panel glass">
    <div class="header-row">
      <a href="/" class="logo-link">
        <div class="logo">AVBOY</div>
      </a>
    </div>

    <div class="search-filter-box">
      <input
        type="text"
        id="search"
        class="search"
        placeholder="Search Videos..."
      >

      <div class="filter-row">
        <select id="filterView" class="filter-select">
          <option value="view_desc"> High View</option>
          <option value="view_asc"> Low view</option>
        </select>

        <select id="filterTime" class="filter-select">
          <option value="all">All Time</option>
          <option value="7">7 day</option>
          <option value="30">30 day</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <main class="container">
    <div id="video-grid" class="grid"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    © 2026 avboy.top - All rights reserved.
  </footer>

  <script src="js/main.js?v=10"></script>
    
</body>
</html>
